<title>Lebensmittel-Lexikon</title>
<style>

html{scroll-padding-top:env(safe-area-inset-top,0px)}
[data-theme=meer]{--bg:#e6f0f5;--ink:#10252f;--mut:#516570;--acc:#1c6a8a;--line:#cfdde5}

*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Georgia,"Times New Roman",serif;min-height:100vh}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px}
h1{margin:0 0 10px;font-size:1.5rem;letter-spacing:.01em}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button,select,input,textarea{font:inherit;color:var(--ink)}
button,select{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--acc)}
button.p{background:var(--acc);color:var(--on);border-color:var(--acc)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#q{flex:1 1 220px;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{border-radius:99px;padding:3px 12px;font-size:.9rem}
.chip[style]{border-color:var(--c);border-width:2px}.chip.on{background:var(--c,var(--acc));color:#fff;border-color:var(--c,var(--acc))}
main{padding:16px;max-width:1400px;margin:0 auto}
#cnt{color:var(--mut);margin:0 0 12px;font-size:.9rem}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{position:relative;overflow:hidden;background:color-mix(in srgb,var(--e1) 9%,var(--card));border:1px solid color-mix(in srgb,var(--e1) 35%,var(--line));border-radius:10px;padding:14px 14px 14px 22px;text-align:left;display:block;width:100%}
.card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:linear-gradient(var(--e1),var(--e2))}
.dot{display:inline-block;width:.7em;height:.7em;border-radius:50%;margin-right:4px}
.full h1{display:none}.full header{padding:8px 16px}.full main{max-width:none}
.card h3{margin:0 0 4px;font-size:1.1rem}
.kcal{font-size:1.8rem;color:var(--acc);line-height:1.1}
.kcal small{font-size:.8rem;color:var(--mut)}
.sub{color:var(--mut);font-size:.88rem;margin-top:6px}
dialog{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:20px;width:min(680px,94vw);max-height:90vh}
dialog::backdrop{background:rgba(0,0,0,.5)}
dl{margin:12px 0}
dt{font-weight:bold;color:var(--acc);margin-top:10px;font-size:.92rem}
dd{margin:2px 0 0}
label{display:block;margin-top:10px;font-size:.9rem;color:var(--mut)}
label input,label textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.empty{color:var(--mut);padding:30px 0;text-align:center}
</style>
</head>

    <button id="fs">Vollbild</button>
    <input id="file" type="file" accept=".json,application/json" hidden>

  <div class="chips" id="chips"></div>
</header>
<main><p id="cnt"></p><div id="grid"></div></main>

const F=[["n","Lebensmittel"],["k","Kalorien & Makronährstoffe (pro 100 g)"],["v","Wichtige Vitamine"],["m","Wichtige Mineralien"],["c","Cholesterin & Fette"],["t","Chinesische 5-Elemente-Lehre"],["h","Gesundheitlicher Einfluss"]];
const EL=["Holz","Feuer","Erde","Metall","Wasser"],TH=["salbei","meer","beere","nacht"],TN=["Salbei","Meer","Beere","Nacht"];
const $=s=>document.querySelector(s);
let data,el=null,ti=0,sel=null;
try{data=JSON.parse(localStorage.getItem("lexikon"));ti=+localStorage.getItem("lexTheme")||0}catch(e){}
if(!Array.isArray(data)||!data.length)data=D0.map(a=>Object.fromEntries(F.map((f,i)=>[f[0],a[i]])));
const persist=()=>{try{localStorage.setItem("lexikon",JSON.stringify(data))}catch(e){}};
try{if(localStorage.getItem("lexV")!="3"){const have=new Set(data.map(o=>o.n));D0.forEach(a=>{if(!have.has(a[0]))data.push(Object.fromEntries(F.map((f,i)=>[f[0],a[i]])))});persist();localStorage.setItem("lexV","3")}}catch(e){}
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const kc=o=>{const m=(o.k||"").match(/\d+/);return m?+m[0]:0};
function setTheme(i){ti=i%TH.length;document.documentElement.dataset.theme=TH[ti];$("#theme").textContent="Stil: "+TN[ti];try{localStorage.setItem("lexTheme",ti)}catch(e){}}
const EC={Holz:"#3f9150",Feuer:"#d94b32",Erde:"#c4912b",Metall:"#7d8c9c",Wasser:"#2f7bc4"};
const els=o=>EL.filter(e=>(o.t||"").includes(e));
const cs=o=>{const c=els(o).map(e=>EC[e]),a=c[0]||"var(--acc)";return `--e1:${a};--e2:${c[1]||a}`};
const dots=o=>els(o).map(e=>`<span class="dot" style="background:${EC[e]}"></span>`).join("");
function chips(){$("#chips").innerHTML=["Alle",...EL].map(e=>`<button class="chip ${(el||"Alle")===e?"on":""}" data-e="${e}" ${EC[e]?`style="--c:${EC[e]}"`:""}>${e}</button>`).join("")}
function render(){
  const q=$("#q").value.toLowerCase().trim(),s=$("#sort").value;
  let l=data.map((o,i)=>[o,i]).filter(([o])=>(!q||F.some(f=>(o[f[0]]||"").toLowerCase().includes(q)))&&(!el||(o.t||"").includes(el)));
  l.sort((a,b)=>s=="n"?a[0].n.localeCompare(b[0].n,"de"):s=="ka"?kc(a[0])-kc(b[0]):kc(b[0])-kc(a[0]));
  $("#cnt").textContent=l.length+" von "+data.length+" Lebensmitteln";
  $("#grid").innerHTML=l.length?l.map(([o,i])=>`<button class="card" data-i="${i}" style="${cs(o)}"><h3>${esc(o.n)}</h3><div class="kcal">${kc(o)} <small>kcal / 100 g</small></div><div class="sub">${esc(o.k)}</div><div class="sub">${dots(o)}${esc(o.t)}</div></button>`).join(""):`<div class="empty">Nichts gefunden. Mit „+ Neu“ legst du ein Lebensmittel an.</div>`;
  chips();
}
function detail(i){
  const o=data[i],d=$("#dlg");
  d.innerHTML=`<h2 style="margin:0">${esc(o.n)}</h2><dl>${F.slice(1).map(f=>`<dt>${f[1]}</dt><dd>${esc(o[f[0]])}</dd>`).join("")}</dl><div class="row"><button id="del">Löschen</button><button id="ed">Bearbeiten</button><button class="p" id="cl">Schließen</button></div>`;
  d.showModal();
  $("#cl").onclick=()=>d.close();
  $("#ed").onclick=()=>form(i);
  $("#del").onclick=()=>{if(confirm(o.n+" wirklich löschen?")){data.splice(i,1);persist();render();d.close()}};
}
function form(i){
  const o=i==null?{}:data[i],d=$("#dlg");
  d.innerHTML=`<h2 style="margin:0">${i==null?"Neues Lebensmittel":"Bearbeiten"}</h2><form id="f" method="dialog">${F.map(f=>`<label>${f[1]}<textarea name="${f[0]}" rows="${f[0]=="n"?1:2}" ${f[0]=="n"?"required":""}>${esc(o[f[0]])}</textarea></label>`).join("")}<div class="row"><button type="button" id="cl">Abbrechen</button><button class="p" type="submit">Speichern</button></div></form>`;
  if(!d.open)d.showModal();
  $("#cl").onclick=()=>d.close();
  $("#f").onsubmit=e=>{e.preventDefault();const n={};F.forEach(f=>n[f[0]]=e.target[f[0]].value.trim());if(i==null)data.push(n);else data[i]=n;persist();render();d.close()};
}
$("#grid").onclick=e=>{const c=e.target.closest(".card");if(c)detail(+c.dataset.i)};
$("#chips").onclick=e=>{const c=e.target.closest(".chip");if(c){el=c.dataset.e=="Alle"?null:c.dataset.e;render()}};
$("#q").oninput=render;$("#sort").onchange=render;
$("#add").onclick=()=>form(null);
$("#theme").onclick=()=>setTheme(ti+1);
let pf=false;
const fsLabel=()=>$("#fs").textContent=(document.fullscreenElement||pf)?"Vollbild beenden":"Vollbild";
$("#fs").onclick=async()=>{
  if(document.fullscreenElement){await document.exitFullscreen();return}
  if(pf){pf=false;document.body.classList.remove("full");fsLabel();return}
  try{await document.documentElement.requestFullscreen()}catch(e){pf=true;document.body.classList.add("full");fsLabel()}
};
document.onfullscreenchange=fsLabel;
$("#save").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));a.download="lebensmittel-lexikon.json";a.click();URL.revokeObjectURL(a.href)};
$("#load").onclick=()=>$("#file").click();
$("#file").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(!Array.isArray(j)||!j.every(o=>o&&typeof o.n=="string"))throw 0;if(confirm(j.length+" Einträge laden? Die aktuelle Liste wird ersetzt.")){data=j;persist();render()}}catch(x){alert("Die Datei ist keine gültige Lexikon-Datei (JSON).")}};r.readAsText(f);e.target.value=""};
setTheme(ti);render();
</script>
