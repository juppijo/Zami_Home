<!DOCTYPE html>
<html lang="de" data-theme="papier">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Notizwerk</title>
<style>
:root{--bg:#edf0f4;--panel:#fff;--ink:#1b2430;--mute:#677386;--line:#d3dae3;--acc:#2457d6;--accink:#fff;--soft:#e3eafa;--bad:#c23b3b}
[data-theme=nacht]{--bg:#0e1620;--panel:#162230;--ink:#e3ebf3;--mute:#8a9bad;--line:#26364a;--acc:#4cc3b0;--accink:#06201c;--soft:#1d3340;--bad:#ff8080}
[data-theme=moos]{--bg:#e8eee4;--panel:#f6f9f3;--ink:#1e2a1d;--mute:#657361;--line:#cbd8c5;--acc:#3b7636;--accink:#fff;--soft:#d9e7d0}
[data-theme=daemmer]{--bg:#1d1a2b;--panel:#272339;--ink:#ece8f7;--mute:#a49dbd;--line:#3a3552;--acc:#e0a3ff;--accink:#2a1236;--soft:#342e4d;--bad:#ff8f9a}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
[hidden]{display:none!important}
button,input,textarea{font:inherit;color:inherit}
button{background:transparent;border:1px solid var(--line);border-radius:7px;padding:.3rem .7rem;cursor:pointer}
button:hover{background:var(--soft)}
button.pri{background:var(--acc);color:var(--accink);border-color:var(--acc)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
a{color:var(--acc)}
#app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);grid-template-columns:290px minmax(0,1fr)}
.top{grid-column:1/-1;display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;padding:.6rem .9rem;padding-top:calc(.6rem + env(safe-area-inset-top,0px));background:var(--panel);border-bottom:1px solid var(--line)}
.logo{font:700 1.25rem Georgia,serif;margin-right:.6rem}
#q{flex:1;min-width:140px;max-width:380px;padding:.4rem .7rem;border:1px solid var(--line);border-radius:7px;background:var(--bg)}
#st{margin-left:auto;color:var(--mute);font-size:.85rem}
#menu{display:none}
#side{overflow:auto;padding:.8rem;border-right:1px solid var(--line);background:var(--panel)}
#story{overflow:auto;padding:1rem 1.2rem 3rem}
.cloud{display:flex;flex-wrap:wrap;gap:.3rem;margin-bottom:.8rem}
.cnt{color:var(--mute);font-size:.82rem;margin:.2rem 0 .5rem}
.cnt button{font-size:.78rem;padding:0 .4rem;margin-left:.3rem}
.nl{list-style:none;margin:0;padding:0}
.nl button{width:100%;text-align:left;border:0;padding:.4rem .5rem;display:flex;justify-content:space-between;gap:.6rem;border-radius:6px}
.nl small{color:var(--mute);white-space:nowrap}
.nl .cur{background:var(--soft)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:1rem 1.2rem;margin:0 auto 1rem;max-width:760px}
.card.pin{border-left:4px solid var(--acc)}
.card header{display:flex;justify-content:space-between;gap:1rem;align-items:flex-start}
.card header h2{margin:0;font:600 1.45rem/1.25 Georgia,"Iowan Old Style",serif}
.act{display:flex;gap:.3rem;flex-wrap:wrap}
.act button{font-size:.8rem;padding:.2rem .55rem}
.tags{margin-top:.5rem;display:flex;gap:.3rem;flex-wrap:wrap}
.tag{background:var(--soft);border:0;border-radius:99px;padding:.05rem .65rem;font-size:.8rem}
.tag small{color:var(--mute)}
.tag.on{background:var(--acc);color:var(--accink)}
.body{font:1.03rem/1.65 Georgia,"Iowan Old Style",serif;max-width:68ch;margin-top:.7rem;overflow-wrap:anywhere}
.body h1,.body h2,.body h3{font-family:system-ui,sans-serif;line-height:1.25;margin:1rem 0 .4rem}
.body h1{font-size:1.4rem}.body h2{font-size:1.2rem}.body h3{font-size:1.05rem}
.body p{margin:.5rem 0}
.body code,.body pre{font-family:ui-monospace,Consolas,monospace;font-size:.88em;background:var(--soft);border-radius:5px}
.body code{padding:.1rem .35rem}
.body pre{padding:.7rem .9rem;overflow:auto}
.body blockquote{margin:.6rem 0;padding:.1rem .9rem;border-left:3px solid var(--acc);color:var(--mute)}
.body hr{border:0;border-top:1px solid var(--line)}
.body ul,.body ol{padding-left:1.4rem;margin:.5rem 0}
.body ul.tl{list-style:none;padding-left:0}
.body label{cursor:pointer}
.card footer{margin-top:.9rem;padding-top:.5rem;border-top:1px solid var(--line);color:var(--mute);font-size:.8rem}
.ed input,.ed textarea,#lf input,dialog input[type=password]{width:100%;display:block;padding:.5rem .7rem;border:1px solid var(--line);border-radius:7px;background:var(--bg)}
.ed input,.ed textarea{margin-bottom:.5rem}
.ed .ti{font:600 1.3rem Georgia,serif}
.ed textarea{min-height:46vh;resize:vertical;font-family:ui-monospace,Consolas,monospace;line-height:1.5}
.empty{max-width:760px;margin:3rem auto;color:var(--mute);text-align:center}
#lock{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);padding:1rem}
#lf{width:min(380px,100%);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:1.6rem;display:grid;gap:.8rem}
#lf h1{font:700 1.8rem Georgia,serif;margin:0}
#lf p{margin:0;color:var(--mute)}
#lf label,dialog .f{display:grid;gap:.25rem;font-size:.85rem;color:var(--mute)}
#lf button{padding:.55rem}
.err{color:var(--bad)!important;min-height:1.2em;font-size:.85rem}
dialog{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:1.2rem;width:min(520px,94vw)}
dialog::backdrop{background:#0008}
dialog h3{margin:.2rem 0 .6rem}
.pl{display:flex;gap:.7rem;align-items:flex-start;padding:.35rem 0}
.pl small,.hint{color:var(--mute)}
.row{display:flex;gap:.5rem;flex-wrap:wrap}
.end{justify-content:flex-end;margin-top:1rem}
@media(max-width:820px){
 #app{grid-template-columns:minmax(0,1fr)}
 #side{display:none}
 #app.so #side{display:block}
 #app.so #story{display:none}
 #menu{display:inline-block}
 #st{display:none}
}
</style>
</head>
<body>
<div id="lock" hidden>
 <form id="lf">
  <h1>Notizwerk</h1>
  <p id="lmsg"></p>
  <label>Passwort<input type="password" id="p1" autocomplete="current-password"></label>
  <label id="l2" hidden>Passwort wiederholen<input type="password" id="p2" autocomplete="new-password"></label>
  <p class="err" id="lerr"></p>
  <button class="pri" id="lbtn">Öffnen</button>
 </form>
</div>

<div id="app" hidden>
 <div class="top">
  <button id="menu">Liste</button>
  <span class="logo">Notizwerk</span>
  <input id="q" type="search" placeholder="Suchen …" aria-label="Suchen">
  <button id="new" class="pri">Neu</button>
  <button id="rand">Zufall</button>
  <button id="theme">Stil</button>
  <button id="fs">Vollbild</button>
  <button id="plug">Plugins</button>
  <button id="lockb">Sperren</button>
  <span id="st" role="status"></span>
 </div>
 <aside id="side"></aside>
 <main id="story"></main>
</div>
<dialog id="dlg"></dialog>
<input type="file" id="file" accept=".json,application/json" hidden>

<script>
(()=>{
const $=s=>document.querySelector(s),enc=new TextEncoder(),dec=new TextDecoder();
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEY='notizwerk_v1',TK='notizwerk_stil';
const THEMES=[['papier','Papier'],['nacht','Nacht'],['moos','Moos'],['daemmer','Dämmerung']];
const PLUGINS=[
 {id:'md',name:'Markdown',desc:'Überschriften, Fett, Kursiv, Code, Listen, Zitate und Links'},
 {id:'tasks',name:'Aufgaben',desc:'Zeilen mit „- [ ]“ lassen sich in der Ansicht abhaken'},
 {id:'links',name:'Wiki-Links',desc:'„[[Titel]]“ verlinkt auf eine andere Notiz oder legt sie an'},
 {id:'macro',name:'Makros',desc:'Datum und Uhrzeit per „{{heute}}“ und „{{zeit}}“ einfügen'},
 {id:'count',name:'Wortzähler',desc:'Wörter, Zeichen und Änderungsdatum unter jeder Notiz'},
 {id:'cloud',name:'Tag-Wolke',desc:'Alle Tags nach Häufigkeit in der Seitenleiste'},
 {id:'rand',name:'Zufallsnotiz',desc:'Button, der eine zufällige Notiz öffnet'}
];
let S=null,key=null,salt=null,openIds=[],editing=new Set(),q='',tagF=null,t0,stt,fileTxt='';
const b64=u=>{let s='';for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s)};
const unb=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const on=id=>!!S&&S.plugins[id]!==false;

/* Verschlüsselung: PBKDF2 → AES-GCM */
async function derive(pw,s){const k=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:s,iterations:250000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function seal(data,k,s){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},k,enc.encode(JSON.stringify(data)));return{v:1,salt:b64(s),iv:b64(iv),data:b64(new Uint8Array(ct))}}
async function unseal(b,k){return JSON.parse(dec.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb(b.iv)},k,unb(b.data))))}
function stat(m){const s=$('#st');s.textContent=m;clearTimeout(stt);stt=setTimeout(()=>s.textContent='',2200)}
function save(){clearTimeout(t0);t0=setTimeout(flush,350)}
async function flush(){if(!S||!key)return;try{localStorage.setItem(KEY,JSON.stringify(await seal(S,key,salt)));stat('Gespeichert')}catch(e){stat('Speichern fehlgeschlagen')}}

function fresh(){const t=Date.now();return{plugins:{},notes:[
{id:uid(),title:'Willkommen',tags:['start'],pinned:true,created:t,modified:t,body:`# Willkommen im Notizwerk
Alle Notizen bleiben **verschlüsselt** in diesem Browser, ohne Server.

- [ ] Mit „Neu“ eine eigene Notiz anlegen
- [x] Passwort festgelegt
- [ ] Unter „Plugins“ Funktionen ein- und ausschalten

Heute ist {{heute}}. Weiter geht es mit [[Schnellinfos]].`},
{id:uid(),title:'Schnellinfos',tags:['start','beispiel'],pinned:false,created:t,modified:t,body:`Kurze Angaben, die man schnell wieder braucht:

- WLAN: *Gastnetz*
- Türcode: \`1234\`

> Mit Tags findest du Notizen später wieder.`}]}}

/* Darstellung */
function inl(s){return s.replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/\*([^*\s][^*]*)\*/g,'<i>$1</i>').replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')}
function md(h,n){
 const L=h.split('\n');let o='',list=null,code=false;
 const close=()=>{if(list){o+='</'+list+'>';list=null}};
 const open=t=>{if(list!==t){close();o+=t==='ul tl'?'<ul class="tl">':'<'+t+'>';list=t}};
 L.forEach((l,i)=>{
  let m;
  if(l.startsWith('```')){close();o+=code?'</pre>':'<pre>';code=!code;return}
  if(code){o+=l+'\n';return}
  if(m=l.match(/^(#{1,3})\s+(.*)/)){close();o+=`<h${m[1].length}>${inl(m[2])}</h${m[1].length}>`}
  else if((m=l.match(/^[-*]\s+\[( |x)\]\s+(.*)/i))&&on('tasks')){open('ul tl');o+=`<li><label><input type="checkbox" data-n="${n.id}" data-l="${i}" ${m[1]!==' '?'checked':''}> ${inl(m[2])}</label></li>`}
  else if(m=l.match(/^[-*]\s+(.*)/)){open('ul');o+=`<li>${inl(m[1])}</li>`}
  else if(m=l.match(/^\d+[.)]\s+(.*)/)){open('ol');o+=`<li>${inl(m[1])}</li>`}
  else if(l.startsWith('&gt; ')){close();o+=`<blockquote>${inl(l.slice(5))}</blockquote>`}
  else if(/^---+$/.test(l)){close();o+='<hr>'}
  else if(l.trim()===''){close()}
  else{close();o+=`<p>${inl(l)}</p>`}
 });
 close();return o
}
function render(n){
 let h=esc(n.body);
 if(on('macro'))h=h.replace(/\{\{heute\}\}/g,new Date().toLocaleDateString('de-DE')).replace(/\{\{zeit\}\}/g,new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}));
 h=on('md')?md(h,n):h.replace(/\n/g,'<br>');
 if(on('links'))h=h.replace(/\[\[([^\]]+)\]\]/g,'<a href="#" class="wl" data-t="$1">$1</a>');
 return h
}
function wc(n){const w=n.body.trim()?n.body.trim().split(/\s+/).length:0;return `${w} Wörter, ${n.body.length} Zeichen, geändert am ${new Date(n.modified).toLocaleString('de-DE',{dateStyle:'medium',timeStyle:'short'})}`}
function filtered(){const s=q.toLowerCase();return S.notes.filter(n=>(!tagF||n.tags.includes(tagF))&&(!s||(n.title+' '+n.body+' '+n.tags.join(' ')).toLowerCase().includes(s))).sort((a,b)=>(b.pinned-a.pinned)||b.modified-a.modified)}
function drawSide(){
 const L=filtered();let h='';
 if(on('cloud')){const c={};S.notes.forEach(n=>n.tags.forEach(t=>c[t]=(c[t]||0)+1));const ks=Object.keys(c).sort();
  if(ks.length)h+='<div class="cloud">'+ks.map(t=>`<button class="tag${t===tagF?' on':''}" data-a="tag" data-t="${esc(t)}" style="font-size:${(.78+Math.min(c[t],6)*.05).toFixed(2)}rem">${esc(t)} <small>${c[t]}</small></button>`).join('')+'</div>'}
 h+=`<div class="cnt">${L.length} von ${S.notes.length} Notizen</div>`;
 if(tagF)h+=`<div class="cnt">Filter: ${esc(tagF)}<button data-a="untag">aufheben</button></div>`;
 h+='<ul class="nl">'+L.map(n=>`<li><button data-a="open" data-id="${n.id}" class="${openIds.includes(n.id)?'cur':''}"><span>${n.pinned?'★ ':''}${esc(n.title||'Ohne Titel')}</span><small>${new Date(n.modified).toLocaleDateString('de-DE')}</small></button></li>`).join('')+'</ul>';
 $('#side').innerHTML=h
}
function card(n){
 if(editing.has(n.id))return `<article class="card ed" data-id="${n.id}"><input class="ti" value="${esc(n.title)}" placeholder="Titel" aria-label="Titel"><input class="tg" value="${esc(n.tags.join(', '))}" placeholder="Tags, durch Komma getrennt" aria-label="Tags"><textarea class="bd" placeholder="Text …" aria-label="Text">${esc(n.body)}</textarea><div class="act"><button data-a="save" class="pri">Speichern</button><button data-a="cancel">Abbrechen</button></div></article>`;
 return `<article class="card${n.pinned?' pin':''}" data-id="${n.id}"><header><h2>${esc(n.title||'Ohne Titel')}</h2><div class="act"><button data-a="edit">Bearbeiten</button><button data-a="pin">${n.pinned?'Lösen':'Anheften'}</button><button data-a="del">Löschen</button><button data-a="close" aria-label="Schließen">✕</button></div></header>${n.tags.length?`<div class="tags">${n.tags.map(t=>`<button class="tag" data-a="tag" data-t="${esc(t)}">${esc(t)}</button>`).join('')}</div>`:''}<div class="body">${render(n)}</div>${on('count')?`<footer>${wc(n)}</footer>`:''}</article>`
}
function drawStory(){$('#story').innerHTML=openIds.length?openIds.map(id=>card(S.notes.find(n=>n.id===id))).join(''):'<div class="empty">Keine Notiz geöffnet. Wähle links eine aus oder lege mit „Neu“ eine an.</div>'}
function drawAll(){drawSide();drawStory();$('#rand').hidden=!on('rand')}
function openNote(id,ed){if(!openIds.includes(id))openIds.unshift(id);if(ed)editing.add(id);$('#app').classList.remove('so');drawAll();$('#story').scrollTop=0;if(ed){const t=document.querySelector('.ed .ti');t&&t.focus()}}
function newNote(title){const t=Date.now(),n={id:uid(),title:title||'',body:'',tags:[],pinned:false,created:t,modified:t};S.notes.push(n);openNote(n.id,true)}

/* Aktionen */
document.addEventListener('click',async e=>{
 const w=e.target.closest('a.wl');
 if(w){e.preventDefault();const n=S.notes.find(x=>x.title.toLowerCase()===w.dataset.t.toLowerCase());n?openNote(n.id):newNote(w.dataset.t);return}
 const b=e.target.closest('[data-a]');if(!b)return;
 const a=b.dataset.a;
 if(a==='dclose'){$('#dlg').close();return}
 if(!S)return;
 const c=b.closest('.card'),id=c?c.dataset.id:b.dataset.id,n=S.notes.find(x=>x.id===id);
 if(a==='open')openNote(id);
 else if(a==='tag'){tagF=tagF===b.dataset.t?null:b.dataset.t;drawSide()}
 else if(a==='untag'){tagF=null;drawSide()}
 else if(a==='edit'){editing.add(id);drawStory();const t=document.querySelector('.ed .bd');t&&t.focus()}
 else if(a==='cancel'){editing.delete(id);if(n&&!n.title&&!n.body){S.notes=S.notes.filter(x=>x!==n);openIds=openIds.filter(x=>x!==id);save()}drawAll()}
 else if(a==='save'){n.title=c.querySelector('.ti').value.trim();n.tags=[...new Set(c.querySelector('.tg').value.split(',').map(s=>s.trim()).filter(Boolean))];n.body=c.querySelector('.bd').value;n.modified=Date.now();editing.delete(id);save();drawAll()}
 else if(a==='pin'){n.pinned=!n.pinned;save();drawAll()}
 else if(a==='del'){if(confirm('Diese Notiz endgültig löschen?')){S.notes=S.notes.filter(x=>x!==n);openIds=openIds.filter(x=>x!==id);editing.delete(id);save();drawAll()}}
 else if(a==='close'){openIds=openIds.filter(x=>x!==id);editing.delete(id);drawAll()}
 else if(a==='export'){const bl=new Blob([JSON.stringify(await seal(S,key,salt),null,1)],{type:'application/json'}),l=document.createElement('a');l.href=URL.createObjectURL(bl);l.download='notizwerk-sicherung-'+new Date().toISOString().slice(0,10)+'.json';l.click();setTimeout(()=>URL.revokeObjectURL(l.href),4000)}
 else if(a==='import')$('#file').click();
 else if(a==='chpw')ask('Passwort ändern',['Neues Passwort (mindestens 6 Zeichen)','Neues Passwort wiederholen'],async v=>{if(v[0].length<6)return 'Mindestens 6 Zeichen.';if(v[0]!==v[1])return 'Die Passwörter stimmen nicht überein.';salt=crypto.getRandomValues(new Uint8Array(16));key=await derive(v[0],salt);await flush();return null});
});
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.dataset.n){const n=S.notes.find(x=>x.id===t.dataset.n),L=n.body.split('\n'),i=+t.dataset.l;L[i]=L[i].replace(/\[( |x)\]/i,t.checked?'[x]':'[ ]');n.body=L.join('\n');n.modified=Date.now();save();drawSide()}
 else if(t.dataset.p){S.plugins[t.dataset.p]=t.checked;save();drawAll()}
});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){const b=document.querySelector('.ed [data-a=save]');b&&b.click()}});
$('#q').oninput=e=>{q=e.target.value;if(S)drawSide()};
$('#new').onclick=()=>newNote();
$('#rand').onclick=()=>{if(S.notes.length)openNote(S.notes[Math.floor(Math.random()*S.notes.length)].id)};
$('#menu').onclick=()=>$('#app').classList.toggle('so');
$('#theme').onclick=()=>{const i=(THEMES.findIndex(t=>t[0]===document.documentElement.dataset.theme)+1)%THEMES.length;setTheme(THEMES[i][0]);stat('Stil: '+THEMES[i][1])};
function setTheme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem(TK,t)}catch(e){}}
$('#fs').onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(e){}};
document.onfullscreenchange=()=>$('#fs').textContent=document.fullscreenElement?'Vollbild beenden':'Vollbild';
$('#lockb').onclick=async()=>{await flush();S=null;key=null;openIds=[];editing.clear();$('#story').innerHTML=$('#side').innerHTML='';$('#dlg').open&&$('#dlg').close();boot()};

/* Dialoge */
$('#plug').onclick=()=>{
 const d=$('#dlg');
 d.innerHTML='<form method="dialog"><h3>Plugins</h3>'+PLUGINS.map(p=>`<label class="pl"><input type="checkbox" data-p="${p.id}" ${on(p.id)?'checked':''}><span><b>${p.name}</b><br><small>${p.desc}</small></span></label>`).join('')+'<h3>Daten und Passwort</h3><div class="row"><button type="button" data-a="export">Sicherung speichern</button><button type="button" data-a="import">Sicherung laden</button><button type="button" data-a="chpw">Passwort ändern</button></div><p class="hint">Die Notizen sind mit AES-256 verschlüsselt. Das Passwort lässt sich nicht zurücksetzen, auch nicht für Sicherungen.</p><div class="row end"><button class="pri">Schließen</button></div></form>';
 if(!d.open)d.showModal()
};
function ask(title,labels,ok){
 const d=$('#dlg');
 d.innerHTML=`<form><h3>${title}</h3>${labels.map(l=>`<label class="f">${l}<input type="password" autocomplete="off"></label>`).join('')}<p class="err" id="derr"></p><div class="row end"><button type="button" data-a="dclose">Abbrechen</button><button class="pri">OK</button></div></form>`;
 d.querySelector('form').onsubmit=async ev=>{ev.preventDefault();const r=await ok([...d.querySelectorAll('input')].map(i=>i.value));if(r)$('#derr').textContent=r;else d.close()};
 if(!d.open)d.showModal();d.querySelector('input').focus()
}
$('#file').onchange=async e=>{
 const f=e.target.files[0];e.target.value='';if(!f)return;
 const txt=await f.text();
 ask('Sicherung laden',['Passwort dieser Sicherung'],async v=>{
  try{const b=JSON.parse(txt),d=await unseal(b,await derive(v[0],unb(b.salt)));
   if(!confirm('Aktuelle Notizen durch die Sicherung ersetzen?'))return 'Abgebrochen.';
   S=d;S.plugins=S.plugins||{};openIds=[];editing.clear();await flush();drawAll();return null}
  catch(x){return 'Passwort falsch oder Datei ungültig.'}
 })
};

/* Start und Sperrbildschirm */
function boot(){
 const setup=!localStorage.getItem(KEY);
 $('#l2').hidden=!setup;
 $('#lmsg').textContent=setup?'Lege ein Passwort fest. Es schützt alle Notizen und lässt sich nicht zurücksetzen.':'Gib dein Passwort ein, um die Notizen zu öffnen.';
 $('#lbtn').textContent=setup?'Passwort festlegen':'Öffnen';
 $('#lerr').textContent='';$('#p1').value=$('#p2').value='';
 $('#app').hidden=true;$('#lock').hidden=false;$('#p1').focus()
}
$('#lf').onsubmit=async e=>{
 e.preventDefault();
 const err=m=>$('#lerr').textContent=m,p=$('#p1').value,raw=localStorage.getItem(KEY);
 if(!(window.crypto&&crypto.subtle))return err('Dieser Browser unterstützt die Verschlüsselung nicht.');
 try{
  if(!raw){
   if(p.length<6)return err('Mindestens 6 Zeichen.');
   if(p!==$('#p2').value)return err('Die Passwörter stimmen nicht überein.');
   salt=crypto.getRandomValues(new Uint8Array(16));key=await derive(p,salt);S=fresh();await flush()
  }else{
   const b=JSON.parse(raw);salt=unb(b.salt);key=await derive(p,salt);S=await unseal(b,key);S.plugins=S.plugins||{}
  }
 }catch(x){key=null;S=null;return err('Falsches Passwort.')}
 $('#lock').hidden=true;$('#app').hidden=false;
 const first=S.notes.find(n=>n.pinned)||S.notes[0];openIds=first?[first.id]:[];drawAll()
};
try{const t=localStorage.getItem(TK);if(t)document.documentElement.dataset.theme=t}catch(e){}
boot();
})();
</script>
