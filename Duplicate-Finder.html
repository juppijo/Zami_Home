<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Duplicate File Finder - Ordnervergleich</title>
  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-secondary: #1e293b;
      --bg-card: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --border: #475569;
      --danger: #ef4444;
      --success: #10b981;
      --shadow: rgba(0, 0, 0, 0.4);
    }

    [data-theme="light"] {
      --bg-primary: #f8fafc;
      --bg-secondary: #f1f5f9;
      --bg-card: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --accent: #0284c7;
      --accent-hover: #0369a1;
      --border: #cbd5e1;
      --danger: #dc2626;
      --success: #059669;
      --shadow: rgba(0, 0, 0, 0.1);
    }

    [data-theme="emerald"] {
      --bg-primary: #064e3b;
      --bg-secondary: #047857;
      --bg-card: #065f46;
      --text-main: #ecfdf5;
      --text-muted: #a7f3d0;
      --accent: #34d399;
      --accent-hover: #10b981;
      --border: #059669;
      --danger: #f87171;
      --success: #6ee7b7;
      --shadow: rgba(0, 0, 0, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      transition: background-color 0.25s ease, color 0.25s ease, border-color 0.25s ease;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background-color: var(--bg-secondary);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 6px -1px var(--shadow);
      border-bottom: 1px solid var(--border);
    }

    .title-group h1 {
      font-size: 1.4rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .controls {
      display: flex;
      gap: 0.75rem;
      align-items: center;
    }

    button, .btn-select {
      background-color: var(--accent);
      color: #ffffff;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 8px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      box-shadow: 0 2px 4px var(--shadow);
    }

    button:hover, .btn-select:hover {
      background-color: var(--accent-hover);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-secondary {
      background-color: var(--bg-card);
      color: var(--text-main);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background-color: var(--border);
    }

    main {
      flex: 1;
      padding: 2rem;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .folders-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 1.5rem;
    }

    .folder-card {
      background-color: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .folder-card h2 {
      font-size: 1.1rem;
      color: var(--text-muted);
    }

    .folder-path {
      font-size: 0.9rem;
      word-break: break-all;
      background: var(--bg-primary);
      padding: 0.5rem 0.75rem;
      border-radius: 6px;
      border: 1px dashed var(--border);
      min-height: 2.4rem;
      display: flex;
      align-items: center;
    }

    .action-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1rem;
      margin: 0.5rem 0;
    }

    .progress-box {
      background-color: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      display: none;
      flex-direction: column;
      gap: 0.5rem;
    }

    .progress-bar-bg {
      background-color: var(--bg-primary);
      height: 10px;
      border-radius: 5px;
      overflow: hidden;
    }

    .progress-bar-fill {
      background-color: var(--accent);
      height: 100%;
      width: 0%;
      transition: width 0.2s ease;
    }

    .status-text {
      font-size: 0.85rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
    }

    .results-container {
      background-color: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      flex: 1;
    }

    .results-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .duplicate-group {
      background-color: var(--bg-card);
      border-radius: 8px;
      margin-bottom: 1rem;
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .duplicate-header {
      padding: 0.75rem 1rem;
      background-color: rgba(0, 0, 0, 0.1);
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.95rem;
      border-bottom: 1px solid var(--border);
    }

    .file-list {
      list-style: none;
    }

    .file-item {
      padding: 0.6rem 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      font-size: 0.88rem;
    }

    .file-item:last-child {
      border-bottom: none;
    }

    .file-info {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }

    .file-path {
      color: var(--text-muted);
      font-size: 0.8rem;
    }

    .badge {
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: bold;
    }

    .badge-v1 { background-color: rgba(56, 189, 248, 0.2); color: #38bdf8; }
    .badge-v2 { background-color: rgba(245, 158, 11, 0.2); color: #f59e0b; }

    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-muted);
    }

    @media (max-width: 600px) {
      header { flex-direction: column; gap: 1rem; }
      .controls { width: 100%; justify-content: space-between; }
    }
  </style>
</head>
<body data-theme="dark">

  <header>
    <div class="title-group">
      <h1>🔍 Duplicate Finder</h1>
    </div>
    <div class="controls">
      <button id="themeBtn" class="btn-secondary" title="Design-Stil wechseln">
        🎨 Theme
      </button>
      <button id="fullscreenBtn" class="btn-secondary" title="Vollbildmodus">
        ⛶ Vollbild
      </button>
    </div>
  </header>

  <main>
    <div class="folders-grid">
      <div class="folder-card">
        <h2>Verzeichnis 1</h2>
        <div id="path1" class="folder-path">Kein Ordner ausgewählt</div>
        <button id="selectDir1" class="btn-secondary">Ordner 1 wählen...</button>
      </div>
      <div class="folder-card">
        <h2>Verzeichnis 2</h2>
        <div id="path2" class="folder-path">Kein Ordner ausgewählt</div>
        <button id="selectDir2" class="btn-secondary">Ordner 2 wählen...</button>
      </div>
    </div>

    <div class="action-bar">
      <button id="scanBtn" disabled style="padding: 0.8rem 2rem; font-size: 1rem;">
        Dubletten suchen
      </button>
    </div>

    <div id="progressBox" class="progress-box">
      <div class="status-text">
        <span id="statusLabel">Scanne Dateien...</span>
        <span id="statusCount">0 / 0</span>
      </div>
      <div class="progress-bar-bg">
        <div id="progressBar" class="progress-bar-fill"></div>
      </div>
    </div>

    <div class="results-container">
      <div class="results-header">
        <h2>Suchergebnisse</h2>
        <span id="resultsCount" class="file-path"></span>
      </div>
      <div id="resultsList">
        <div class="empty-state">
          Wähle zwei Verzeichnisse aus und starte die Suche, um identische Dateien in beiden Ordnerstrukturen zu finden.
        </div>
      </div>
    </div>
  </main>

  <script>
    const themes = ['dark', 'light', 'emerald'];
    let currentThemeIdx = 0;

    let dirHandle1 = null;
    let dirHandle2 = null;

    const themeBtn = document.getElementById('themeBtn');
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const selectDir1Btn = document.getElementById('selectDir1');
    const selectDir2Btn = document.getElementById('selectDir2');
    const scanBtn = document.getElementById('scanBtn');

    const path1El = document.getElementById('path1');
    const path2El = document.getElementById('path2');
    const progressBox = document.getElementById('progressBox');
    const progressBar = document.getElementById('progressBar');
    const statusLabel = document.getElementById('statusLabel');
    const statusCount = document.getElementById('statusCount');
    const resultsList = document.getElementById('resultsList');
    const resultsCount = document.getElementById('resultsCount');

    // Theme Switcher
    themeBtn.addEventListener('click', () => {
      currentThemeIdx = (currentThemeIdx + 1) % themes.length;
      document.body.setAttribute('data-theme', themes[currentThemeIdx]);
    });

    // Fullscreen Toggle
    fullscreenBtn.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => alert(err.message));
      } else {
        document.exitFullscreen();
      }
    });

    // Directory Pickers
    selectDir1Btn.addEventListener('click', async () => {
      try {
        dirHandle1 = await window.showDirectoryPicker();
        path1El.textContent = dirHandle1.name;
        checkReady();
      } catch (e) {
        console.log('Auswahl abgebrochen');
      }
    });

    selectDir2Btn.addEventListener('click', async () => {
      try {
        dirHandle2 = await window.showDirectoryPicker();
        path2El.textContent = dirHandle2.name;
        checkReady();
      } catch (e) {
        console.log('Auswahl abgebrochen');
      }
    });

    function checkReady() {
      scanBtn.disabled = !(dirHandle1 && dirHandle2);
    }

    // Recursive directory reader
    async function collectFiles(dirHandle, path = '', filesList = []) {
      for await (const entry of dirHandle.values()) {
        const entryPath = path ? `${path}/${entry.name}` : entry.name;
        if (entry.kind === 'file') {
          filesList.push({ handle: entry, path: entryPath, rootName: dirHandle.name });
        } else if (entry.kind === 'directory') {
          await collectFiles(entry, entryPath, filesList);
        }
      }
      return filesList;
    }

    // Hash computation for file content comparison
    async function computeHash(file) {
      const buffer = await file.arrayBuffer();
      const hashBuffer = await crypto.subtle.digest('SHA-256', buffer);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    function formatBytes(bytes) {
      if (bytes === 0) return '0 Bytes';
      const k = 1024;
      const sizes = ['Bytes', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    scanBtn.addEventListener('click', async () => {
      scanBtn.disabled = true;
      progressBox.style.display = 'flex';
      resultsList.innerHTML = '';
      resultsCount.textContent = '';

      try {
        statusLabel.textContent = 'Erfasse Ordnerstrukturen...';
        progressBar.style.width = '0%';

        const files1 = await collectFiles(dirHandle1, dirHandle1.name);
        const files2 = await collectFiles(dirHandle2, dirHandle2.name);

        const allFiles = [
          ...files1.map(f => ({ ...f, origin: 'Verzeichnis 1' })),
          ...files2.map(f => ({ ...f, origin: 'Verzeichnis 2' }))
        ];

        const total = allFiles.length;
        statusLabel.textContent = 'Berechne Datei-Hashes...';

        const hashMap = new Map();
        let processed = 0;

        for (const fileObj of allFiles) {
          const file = await fileObj.handle.getFile();
          
          // Schneller Vorab-Check über Dateigröße, um Berechnungen zu sparen
          const fileKey = `${file.size}`;
          
          const hash = await computeHash(file);
          const fullKey = `${hash}_${file.size}`;

          if (!hashMap.has(fullKey)) {
            hashMap.set(fullKey, { size: file.size, files: [] });
          }
          hashMap.get(fullKey).files.push({ ...fileObj, size: file.size });

          processed++;
          const percent = Math.round((processed / total) * 100);
          progressBar.style.width = `${percent}%`;
          statusCount.textContent = `${processed} / ${total}`;
        }

        renderResults(hashMap);
      } catch (err) {
        alert('Fehler beim Scannen: ' + err.message);
      } finally {
        progressBox.style.display = 'none';
        scanBtn.disabled = false;
      }
    });

    function renderResults(hashMap) {
      resultsList.innerHTML = '';
      let duplicateGroupsCount = 0;

      hashMap.forEach((group, hash) => {
        // Filter: Zeige nur Gruppen mit mindestens 2 Dateien an,
        // und idealerweise solchen, die in beiden Verzeichnissen vorkommen
        const origins = new Set(group.files.map(f => f.origin));

        if (group.files.length >= 2) {
          duplicateGroupsCount++;

          const groupEl = document.createElement('div');
          groupEl.className = 'duplicate-group';

          const headerEl = document.createElement('div');
          headerEl.className = 'duplicate-header';
          headerEl.innerHTML = `
            <span>📄 Identische Datei (${group.files.length} Vorkommen)</span>
            <span>Größe: ${formatBytes(group.size)}</span>
          `;

          const listEl = document.createElement('ul');
          listEl.className = 'file-list';

          group.files.forEach(f => {
            const itemEl = document.createElement('li');
            itemEl.className = 'file-item';

            const isV1 = f.origin === 'Verzeichnis 1';
            const badgeClass = isV1 ? 'badge-v1' : 'badge-v2';

            itemEl.innerHTML = `
              <div class="file-info">
                <strong>${f.handle.name}</strong>
                <span class="file-path">${f.path}</span>
              </div>
              <span class="badge ${badgeClass}">${f.origin}</span>
            `;
            listEl.appendChild(itemEl);
          });

          groupEl.appendChild(headerEl);
          groupEl.appendChild(listEl);
          resultsList.appendChild(groupEl);
        }
      });

      if (duplicateGroupsCount === 0) {
        resultsList.innerHTML = `
          <div class="empty-state">
            Keine doppelten Dateien in den zwei Verzeichnissen gefunden.
          </div>
        `;
        resultsCount.textContent = '0 Duplikate gefunden';
      } else {
        resultsCount.textContent = `${duplicateGroupsCount} Gruppe(n) doppelter Dateien gefunden`;
      }
    }
  </script>
</body>
</html>
